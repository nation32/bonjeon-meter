<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="구독·고정비, 쓸 때마다 도장 찍고 본전 뽑기">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="본전">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>본전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: a phone-first app column. Three tabs (도장·리포트·내 고정비) above a fixed bar; detail and add open as full pages; bottom sheets for savings and settings. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#1B1F27; --sub:#505A69; --mute:#8A94A3; --line:#EDEFF2; --line2:#F0F1F4; --field:#F3F4F6;
  --accent:#6A4DF4; --accent-ink:#FFFFFF; --accent-dark:#5235D6; --accent-tint:#EFEBFE;
  --good:#12833F; --good-tint:#E6F4EA; --bad:#C8343A; --bad-tint:#FDECEC; --warn:#9A5B00; --warn-tint:#FDF3E1;
  --scrim:rgba(27,31,39,.48);
  --t0:#FDECEC; --i0:#C8343A; --t1:#E8F0FE; --i1:#2E62C9; --t2:#E6F4EA; --i2:#17803D; --t3:#E3F4F6; --i3:#0B7A86;
  --t4:#FDF0E3; --i4:#C0600E; --t5:#FCE8F1; --i5:#B4316B; --t6:#F4EEE6; --i6:#8A5A2B; --t7:#ECEFF3; --i7:#4E5968;
  --f:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101218; --surface:#1A1D26; --ink:#E9ECF2; --sub:#A7AFBD; --mute:#7D8696; --line:#272B36; --line2:#232733; --field:#232733;
  --accent:#8B74FF; --accent-ink:#FFFFFF; --accent-dark:#B3A4FF; --accent-tint:#2A2447;
  --good:#3DCC7A; --good-tint:#163222; --bad:#FF6B6B; --bad-tint:#3A1F22; --warn:#F0B24A; --warn-tint:#3A2A18; --scrim:rgba(0,0,0,.6);
  --t0:#3A1F22; --i0:#FF8A8A; --t1:#1E2A44; --i1:#8FB2FF; --t2:#18301F; --i2:#6FD08C; --t3:#163338; --i3:#5FD0DA;
  --t4:#3A2A18; --i4:#FFB067; --t5:#3A1E2C; --i5:#FF8CC0; --t6:#33291F; --i6:#D9AE7E; --t7:#262B33; --i7:#B5BECB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101218; --surface:#1A1D26; --ink:#E9ECF2; --sub:#A7AFBD; --mute:#7D8696; --line:#272B36; --line2:#232733; --field:#232733;
  --accent:#8B74FF; --accent-ink:#FFFFFF; --accent-dark:#B3A4FF; --accent-tint:#2A2447;
  --good:#3DCC7A; --good-tint:#163222; --bad:#FF6B6B; --bad-tint:#3A1F22; --warn:#F0B24A; --warn-tint:#3A2A18; --scrim:rgba(0,0,0,.6);
  --t0:#3A1F22; --i0:#FF8A8A; --t1:#1E2A44; --i1:#8FB2FF; --t2:#18301F; --i2:#6FD08C; --t3:#163338; --i3:#5FD0DA;
  --t4:#3A2A18; --i4:#FFB067; --t5:#3A1E2C; --i5:#FF8CC0; --t6:#33291F; --i6:#D9AE7E; --t7:#262B33; --i7:#B5BECB; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html.lock,html.lock body{overflow:hidden}
.wrap{max-width:560px;margin:0 auto;padding-block:16px calc(108px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:4px 4px 4px}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.top .brand{font-size:18px;font-weight:800;letter-spacing:-.02em}
.top p{margin:2px 0 0;font-size:15px;color:var(--sub)}
.top .date{font-size:15px;color:var(--sub);font-weight:500}

.card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tight{padding:6px 18px}
.h2b{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.h2{margin:0;font-size:18px;font-weight:700}
.ch{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.ch .side{font-size:13px;color:var(--mute);white-space:nowrap}
.sub{font-size:14px;color:var(--mute);margin:0}
.lbl{font-size:14px;color:var(--sub)}
.good{color:var(--good)} .bad{color:var(--bad)}
.big{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.hero{display:block;font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.link{background:none;border:0;padding:0;color:var(--mute);font-size:14px;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.link:hover{color:var(--ink)}
.link b{font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--field);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-dark)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--bad)}
.textbtn{background:none;border:0;color:var(--sub);font-size:15px;padding:10px 4px;text-decoration:underline;text-underline-offset:3px}

/* identity avatar + stamp */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;letter-spacing:-.03em;white-space:nowrap;overflow:hidden}
.av.lg{width:44px;height:44px;font-size:14px}
.t0{background:var(--t0);color:var(--i0)}.t1{background:var(--t1);color:var(--i1)}.t2{background:var(--t2);color:var(--i2)}.t3{background:var(--t3);color:var(--i3)}
.t4{background:var(--t4);color:var(--i4)}.t5{background:var(--t5);color:var(--i5)}.t6{background:var(--t6);color:var(--i6)}.t7{background:var(--t7);color:var(--i7)}
.emo{display:block;line-height:1;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;letter-spacing:0}
.tmark{display:inline-grid;place-items:center;border:2px solid currentColor;border-radius:6px;padding:0 3px;font-size:.5em;font-weight:800;line-height:1.3;font-family:var(--f)}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.stampbtn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.stampbtn:disabled{opacity:.4;cursor:default}
.sb-c{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:-.03em;transition:transform .15s}
.sb-c.on{background:var(--accent);color:var(--accent-ink);font-size:28px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.sb-c.on .tmark{font-size:13px;color:var(--accent-ink)}
.stampbtn:active .sb-c{transform:scale(.94)}
.sb-l{font-size:13px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-l.on{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .sbig.thunk,.sb-c.thunk{animation:thunk .4s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes thunk{0%{transform:scale(1.6) rotate(-14deg);opacity:.2}60%{transform:scale(.92) rotate(3deg);opacity:1}100%{transform:scale(1)}}
  .bar i{transition:width .4s ease}
}
.msg{margin:0;background:var(--accent-tint);color:var(--accent-dark);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}

.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sumfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;flex-wrap:wrap}
.sumfoot span{color:var(--sub)}
.sumfoot b{color:var(--ink)}
.sumfoot b.good{color:var(--good)}

/* tasks */
.task{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line2)}
.task:first-of-type{border-top:0;padding-top:4px}
.task-h{display:flex;align-items:center;gap:12px}
.task-h b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.task-h .sub{font-size:13px}
.task-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tbtn{border:0;border-radius:12px;background:var(--field);padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tbtn b{font-size:14px;font-weight:700}
.tbtn span{font-size:12px;color:var(--sub)}
.tbtn.pri{background:var(--accent-tint);color:var(--accent-dark)}
.tbtn.pri span{color:var(--accent-dark)}
.note{font-size:12px;color:var(--mute);margin:0}
.more{background:none;border:0;border-top:1px solid var(--line2);padding:12px 0 4px;font-size:14px;color:var(--sub);width:100%}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;background:none;border:0;width:100%;text-align:left;min-width:0}
.row + .row{border-top:1px solid var(--line2)}
.row .mid{display:flex;flex-direction:column;flex-grow:1;min-width:0;gap:5px}
.row .nm{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.row .ds{font-size:13px;color:var(--mute);line-height:1.35}
.row .ds.bad{color:var(--bad);font-weight:600}
.row .ds.good{color:var(--good);font-weight:600}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.row .rt b{font-size:16px;font-weight:700}
.row .rt span{font-size:13px;color:var(--mute)}
.bar{height:4px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar.lg{height:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 2px}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--surface);color:var(--sub);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
details.fold > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary b{font-size:16px;font-weight:600}
details.fold > summary span{font-size:14px;color:var(--good);font-weight:600}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{margin:0;font-size:20px;font-weight:800}
.empty p{margin:0;color:var(--sub);font-size:15px}
.empty .rowb{display:flex;gap:8px;flex-wrap:wrap}

/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.navs{display:flex;gap:4px}
.navbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;text-align:center}
.cal .dow{font-size:12px;color:var(--mute);padding-bottom:6px}
.cal .dow.sun{color:var(--bad)}
.dbtn{background:none;border:0;min-height:50px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;font-size:13px;color:var(--sub);min-width:0}
.dbtn .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;line-height:1}
.dbtn.sun .n{color:var(--bad)}
.dbtn.future{color:var(--mute);opacity:.55}
.dbtn.today .n{background:var(--ink);color:var(--bg);font-weight:700}
.dbtn.sel{background:var(--accent-tint)}
.dbtn .mk{display:flex;gap:1px;font-size:13px;line-height:1;align-items:center;max-width:100%;overflow:hidden}
.dbtn .mk .tmark{font-size:8px;border-width:1.5px;padding:0 2px}
.dbtn .mk small{font-size:10px;color:var(--mute)}
.mcal .dbtn{min-height:40px}
.mcal .dbtn .n{width:32px;height:32px}
.mcal .dbtn.on .n{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mcal .dbtn.today:not(.on) .n{background:none;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.mcal .dbtn:disabled{cursor:default}

/* info rows */
.info{display:flex;flex-direction:column}
.info div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px}
.info div + div{border-top:1px solid var(--line2)}
.info span{color:var(--sub)}
.info b{font-weight:600;text-align:right}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.confirm{background:var(--bad-tint);color:var(--bad);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.confirm .rowb{display:flex;gap:8px;justify-content:flex-end}
.banner.demo-on{background:var(--accent-tint);color:var(--accent-dark)}
.banner.demo-on .btn{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--good-tint);color:var(--good);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* pages (detail, add) */
.page{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.page.white{background:var(--surface)}
.page-in{max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.pagehead{display:flex;justify-content:space-between;align-items:center;padding:10px 0 0;margin-left:-8px;margin-right:-4px}
.iconbtn{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:12px}
.dtop{display:flex;flex-direction:column;gap:6px;padding:0 6px 6px}
.dtop .who{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--sub)}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:21;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.page.white .cta{background:linear-gradient(to top,var(--surface) 72%,transparent)}
.cta-in{max-width:560px;margin:0 auto}
.cta button{width:100%;height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700}
.cta button:hover{background:var(--accent-dark)}
.cta button.sec{background:var(--field);color:var(--ink)}

/* add */
.h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
.search{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:14px;padding:0 14px;height:52px}
.search input{border:0;background:transparent;outline:none;font-size:16px;flex-grow:1;min-width:0}
.pop{display:flex;flex-wrap:wrap;gap:8px}
.pop button{border:0;background:var(--field);border-radius:999px;padding:9px 14px;font-size:15px}
.grp{display:flex;align-items:center;gap:14px;padding:13px 0;background:none;border:0;width:100%;text-align:left}
.grp .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px}
.grp .tx{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.grp .tx b{font-size:16px;font-weight:600}
.grp .tx span{font-size:13px;color:var(--mute)}
.secttl{font-size:15px;font-weight:700;margin:6px 0 0}
.catttl{font-size:13px;font-weight:700;color:var(--mute);margin:10px 0 2px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;background:none;border:0;width:100%;text-align:left;border-top:1px solid var(--line2)}
.prow .tx{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.prow .tx b{font-size:15px;font-weight:600}
.prow .tx span{font-size:13px;color:var(--mute)}
.prow .em{font-size:22px;width:32px;text-align:center;flex:none}
.f{display:flex;flex-direction:column;gap:8px}
.f > label,.f > .fl{font-size:14px;color:var(--sub)}
.amt{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--accent);padding-bottom:8px}
.amt input{border:0;outline:none;font-size:30px;font-weight:800;width:100%;padding:0;background:transparent;min-width:0}
.amt span{font-size:22px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--field);border-radius:12px;padding:4px}
.seg label{text-align:center;padding:9px 2px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg input,.pills input,.emos input,.inks input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(27,31,39,.12)}
.seg label:has(input:focus-visible),.pills label:has(input:focus-visible),.emos label:has(input:focus-visible),.inks label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.help{font-size:13px;color:var(--mute);margin:0;line-height:1.5}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills label{border-radius:999px;padding:7px 12px;background:var(--field);font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.pills label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.frows{display:flex;flex-direction:column}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.frow .tx{display:flex;flex-direction:column;min-width:0}
.frow .tx b{font-size:16px;font-weight:500;color:var(--sub)}
.frow .tx span{font-size:13px;color:var(--mute)}
.frow input[type="date"],.frow select,.frow .inl{border:0;background:var(--field);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:600;max-width:60%;min-width:0}
.frow .inl{width:120px;text-align:right}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(20px)}
.box{background:var(--accent-tint);border-radius:16px;padding:4px 16px;display:flex;flex-direction:column}
.box .frow{border-top-color:color-mix(in srgb,var(--accent) 14%,transparent)}
.box .frow:first-child{border-top:0}
.box .frow input,.box .frow select{background:var(--surface)}
.steps{display:flex;flex-direction:column;gap:12px;padding:4px 0 8px}
.steps div{display:flex;gap:12px;align-items:flex-start}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.steps b{display:block;font-size:15px;font-weight:600}
.steps span{font-size:13px;color:var(--mute)}
.emos{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.emos label{width:40px;height:40px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:20px;cursor:pointer}
.emos label:has(input:checked){background:var(--accent-tint);box-shadow:0 0 0 2px var(--accent)}
.emos .own{width:64px;height:40px;border-radius:10px;border:0;background:var(--field);text-align:center;font-size:18px}
.inks{display:flex;gap:8px;flex-wrap:wrap}
.inks label{cursor:pointer}
.inks .av{width:36px;height:36px;font-size:11px}
.inks label:has(input:checked) .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.preview{background:var(--field);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.preview .row{background:var(--surface);border-radius:12px;padding:10px 12px}
.err{color:var(--bad);font-size:14px;margin:0}
.name-in{border:0;background:none;font-size:16px;font-weight:600;color:var(--sub);padding:2px 0;min-width:0;flex:1;border-bottom:1px dashed var(--line)}
details.more2 summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line2);font-size:15px;color:var(--mute)}
details.more2 summary::-webkit-details-marker{display:none}
details.more2[open] summary{color:var(--sub)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);border-radius:26px 26px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;padding:12px 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);align-self:center}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700}
.foot{background:var(--field);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--sub);line-height:1.5;display:flex;flex-direction:column;gap:4px}
.foot b{color:var(--ink)}

/* onboarding */
.onb{gap:22px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(210px + env(safe-area-inset-bottom,0px))}
.onb-brand{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.onb-h{margin:0;font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.32}
.demo{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.demo-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo-top .who{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--sub)}
.demo-ic{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.demo-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.demo-mid > span{display:flex;flex-direction:column;gap:2px}
.demo-n{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.demo-btn{flex:none;width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:800;line-height:1.25;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 7%,var(--surface)),0 0 0 6px var(--accent)}
.demo-btn .e{font-size:34px;line-height:1}
.demo-msg{margin:0;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--accent-dark);font-weight:600}
.onb-vs{margin:0;font-size:17px;font-weight:700;line-height:1.45}
.onb-vs .m{color:var(--mute)} .onb-vs .a{color:var(--accent)}
.feats{display:flex;flex-direction:column;gap:14px}
.feat{display:flex;gap:12px;align-items:center}
.feat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.feat b{display:block;font-size:15px;font-weight:600}
.feat > span:last-child span{font-size:13px;color:var(--mute)}
.onb-cta{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.cta .textbtn{width:auto;height:auto;background:none;color:var(--sub);font-size:15px;font-weight:500;text-decoration:none;padding:6px}
.cta .textbtn:hover{background:none;color:var(--ink)}
.cta button:disabled{background:var(--line);color:var(--mute);cursor:default}
.pgrp{display:flex;flex-direction:column;gap:8px}
.pgrp .catttl{margin:0}
.pgrp .catttl span{font-weight:500}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:0;border-radius:999px;padding:9px 14px;background:var(--field);font-size:15px}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.page.white .cta.onb-bar,.cta.onb-bar{background:var(--surface);border-top:1px solid var(--line)}
.sumline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:14px;color:var(--sub)}
.sumline b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.onb-home{border:0;text-align:left;flex-direction:row;align-items:center;font:inherit;color:inherit;width:100%}
.onb-home .tx{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.onb-home .tx b{font-size:15px;font-weight:600}
.onb-home .tx span{font-size:13px;color:var(--mute)}
.onb-home .go{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
.cnt{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap}

.prog{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.onbq{gap:20px}
.olist{display:flex;flex-direction:column;margin:0 -8px}
.orow{display:flex;align-items:center;gap:14px;padding:11px 8px;background:none;border:0;border-radius:14px;width:100%;text-align:left}
.orow .em{width:44px;height:44px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:22px;flex:none}
.orow .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.orow .tx b{font-size:16px;font-weight:600;line-height:1.35}
.orow .tx span{font-size:13px;color:var(--mute)}
.orow .ck{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:transparent}
.orow[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.orow[aria-pressed="true"] .ck{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.onbq .catttl{margin:14px 0 2px}
.opreview{padding:6px 18px;box-shadow:0 6px 24px rgba(27,31,39,.10),0 0 0 1px var(--line)}
.opill{font-size:13px;font-weight:700;color:var(--accent-dark);background:var(--accent-tint);border-radius:999px;padding:5px 10px;white-space:nowrap}
.ohome{background:linear-gradient(160deg,var(--accent-tint),var(--t1));border-radius:22px;padding:22px;display:grid;grid-template-columns:repeat(4,52px);justify-content:space-between;row-gap:18px}
.ohome span{width:52px;height:52px;border-radius:13px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.ohome .me{background:#16233A;color:#FF5A4E;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.osteps{display:flex;flex-direction:column;gap:14px}
.osteps > div{display:flex;align-items:center;gap:12px}
.osteps .n{width:26px;height:26px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.osteps .t{font-size:16px;flex:1}
.osteps .ic{color:var(--i1)}

.opromise{margin:0;line-height:1.4;display:flex;align-items:center;gap:10px;background:var(--accent-tint);border-radius:14px;padding:13px 16px;font-size:17px;font-weight:800;color:var(--accent-dark);letter-spacing:-.03em}
.opromise .ic{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.opreview .nm{font-size:16px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end}
.tab{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute);padding:2px 0}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}

.small{font-size:13px;color:var(--mute)}
.small b{color:var(--ink)}
.backup{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.backup label.btn{cursor:pointer}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-sizing:border-box}
.toast button{background:none;border:0;color:var(--accent-tint);font-weight:700;padding:0;white-space:nowrap}

/* stamp tab */
.top .date{display:block;font-size:14px;color:var(--mute)}
.hbtns{display:flex;gap:2px;margin-right:-8px}
.scards{display:flex;flex-direction:column;gap:12px}
.scard{background:var(--surface);border-radius:22px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.scard.hl{box-shadow:0 0 0 2px var(--accent)}
.sc-h{display:flex;align-items:center;gap:12px}
.sc-ic{width:44px;height:44px;border-radius:14px;background:var(--field);border:0;padding:0;display:grid;place-items:center;font-size:24px;flex:none;color:var(--sub)}
.sc-ic .tmark{font-size:12px}
.sc-ic.sm{width:40px;height:40px;border-radius:12px;font-size:22px}
.sc-m{display:flex;flex-direction:column;flex:1;min-width:0;gap:3px}
.sc-n{font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.sc-n small{font-size:13px;font-weight:500;color:var(--mute);margin-left:6px;white-space:nowrap}
.sc-now{font-size:14px;color:var(--sub)}
.sc-nx{font-size:15px;color:var(--sub);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.sc-nx b{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1.2}
.sc-pair{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sc-old{font-size:15px;color:var(--mute);text-decoration:line-through}
.sc-new{font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1.2}
.sc-ok{font-size:15px;font-weight:700;color:var(--good)}
.sc-done{font-size:13px;font-weight:700;color:var(--accent)}
.sc-f{display:flex;flex-direction:column;gap:6px}
.sc-f > span:not(.bar){font-size:12px;color:var(--mute)}
.bar.md{height:6px}
.sbig{flex:none;width:64px;height:64px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1.25;text-align:center;box-shadow:0 4px 12px rgba(106,77,244,.35);transition:transform .15s}
.sbig:active{transform:scale(.94)}
.sbig.on{font-size:28px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.sbig.on .tmark{font-size:13px;color:var(--accent-ink)}
.msg.nudge{line-height:1.5;margin-top:-4px}
.msg.nudge span{display:block;font-weight:500;color:var(--sub)}
.tbanner{display:flex;align-items:center;gap:10px;background:var(--warn-tint);color:var(--warn);border:0;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;text-align:left;width:100%}
.tbanner .tb-t{flex:1;min-width:0}
.tcard{padding:14px 18px}
.calttl{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.calhead{padding-top:14px}
.calhead p{font-size:13px;color:var(--mute)}
/* report */
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.segbar{display:flex;gap:4px}
.segbar span{flex:1;height:8px;border-radius:8px}
.hero + .segbar{margin-top:2px}
.rsec{padding:6px 18px 4px;gap:0}
.card.tight .rsec-t{padding-top:12px}
.rsec-t{font-size:15px;font-weight:800;padding:10px 0 4px;color:var(--sub)}
.rsec-t.bad{color:var(--bad)} .rsec-t.warn{color:var(--warn)} .rsec-t.good{color:var(--good)}
.ritem + .rsec-t{border-top:1px solid var(--line2);margin-top:2px}
.ritem{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.ritem + .ritem{border-top:1px solid var(--line2)}
.ritem-h{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;width:100%;text-align:left;min-width:0}
.ritem-h .nm{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ritem-h .ds{font-size:13px;color:var(--mute)}
.ritem p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.ritem p.done{font-size:13px;font-weight:600;color:var(--mute)}
.ritem p.done.good{color:var(--good)}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;white-space:nowrap;flex:none}
.pill.bad{background:var(--bad-tint);color:var(--bad)} .pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.good{background:var(--good-tint);color:var(--good)} .pill.mute{background:var(--field);color:var(--sub)}
.rbtns{display:flex;gap:8px}
.rbtns button{flex:1;min-width:0;border:0;border-radius:12px;padding:9px 6px;background:var(--field);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.rbtns b{font-size:14px;font-weight:700}
.rbtns span{font-size:12px;color:var(--sub)}
.rbtns .pri span{color:var(--accent-dark)}
.rbtns button.pri{background:var(--accent-tint);color:var(--accent-dark)}
.savedrow{flex-direction:row;justify-content:space-between;align-items:center;border:0;text-align:left;font-size:15px;color:var(--sub)}
.savedrow b{font-size:18px;font-weight:800}
.tab .dot{position:absolute;top:0;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
/* my fixed costs */
.mineSum{flex-direction:row;justify-content:space-between;align-items:flex-end}
.mineSum .hero{font-size:30px}
.mineSum b{color:var(--ink)}

.ostick{position:sticky;top:0;z-index:3;background:var(--surface);display:flex;flex-direction:column;gap:10px;padding:8px 0 10px;margin:-8px 0 -10px}
.ochips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.ochips::-webkit-scrollbar{display:none}
.ochips .chip{background:var(--field);white-space:nowrap;flex:none;padding:7px 12px}
.ogrp{scroll-margin-top:130px}
.ogrp .catttl{font-size:15px;color:var(--ink);margin:18px 0 2px}
.catttl .ok{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;padding:0 6px;margin-left:4px}
.omore{background:none;border:0;color:var(--accent);font-size:14px;font-weight:700;padding:8px 0;width:100%;text-align:left}

.onb-sub{margin:0;font-size:17px;line-height:1.5;color:var(--sub)}
.onb-sub b{color:var(--ink)}
.otag2{align-self:flex-start;font-size:12px;font-weight:700;color:var(--sub);background:var(--field);border-radius:999px;padding:4px 10px}

.odemo2{background:var(--surface);border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 28px rgba(27,31,39,.10),0 0 0 1px var(--line)}
.odemo2.on{box-shadow:0 0 0 2px var(--accent),0 12px 30px rgba(106,77,244,.18)}
.od-h{display:flex;align-items:center;gap:10px}
.od-t{display:flex;flex-direction:column;flex:1;min-width:0}
.od-t b{font-size:16px}
.od-t span{font-size:13px;color:var(--mute)}
.od-m{display:flex;align-items:center;gap:12px}
.od-l{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;font-size:14px;color:var(--sub);word-break:keep-all}
.od-l b{color:var(--ink)}
.od-l .od-big{font-size:clamp(24px,8vw,34px);font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1.15}
.od-b{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.od-b .sbig{width:68px;height:68px}
.od-hint{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.odemo2 .bar.md{height:8px}
.od-p{font-size:15px;color:var(--sub)}
.od-p b{color:var(--ink)}
.od-p s{color:var(--mute)}
.od-p b.acc{color:var(--accent);font-size:18px}

.odemo2.won{box-shadow:0 0 0 2px var(--good),0 12px 30px rgba(18,131,63,.18)}
.odemo2.won .od-big{color:var(--good)}
.odemo2.won .bar i{background:var(--good)}
.sbig.won{background:var(--good);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--good)}
.od-p b.good{color:var(--good)}
.od-big .emo{display:inline-block;font-size:.8em}
#onbNote b{color:var(--accent)}

/* onboarding v7 */
.ostage{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap;min-width:44px;text-align:right}
.okick{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--accent)}
.ctiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctile{position:relative;border:0;border-radius:18px;min-height:92px;padding:14px;background:var(--field);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;gap:2px;min-width:0}
.ctile .ce{font-size:24px;line-height:1;margin-bottom:auto}
.ctile .cn{font-size:15px;font-weight:700}
.ctile .cx{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ctile .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;background:var(--accent);color:var(--accent-ink)}
.ctile[aria-pressed="true"]{background:var(--accent-tint);box-shadow:inset 0 0 0 2px var(--accent)}
.ctile[aria-pressed="true"] .cn{font-weight:800}
.ctile[aria-pressed="true"] .ck{display:grid}
.osvc{border-radius:16px}
.osvc.on{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.osvc.on .orow[aria-pressed="true"]{background:none}
.ochips2{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 10px 66px}
.ochip{border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;background:var(--surface);color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.ochip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none}
.oamts{display:flex;flex-direction:column}
.oamt{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.oamt .em{width:40px;height:40px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:20px;flex:none}
.oamt .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.oamt .tx b{font-size:16px;font-weight:600}

    const name = fixPlanName(String(r.name || "이름 없음"), kind, months), cat = catOf(String(r.cat || "etc")).id, promoEnd = isDate(r.promoEnd) ? r.promoEnd : "";
    return {
      id: r.id, name, cat, kind,
      mode: r.mode === "flat" || r.mode === "points" ? "flat" : "count",
      price: Math.max(0, Number(r.price) || 0), months,
      start: isDate(r.start) ? r.start : todayStr(), ref: Math.max(0, Number(r.ref) || 0),
      promoEnd, after: promoEnd ? Math.max(0, Number(r.after) || 0) : 0, promoAck: isDate(r.promoAck) ? r.promoAck : "",
      status: r.status === "cancelled" ? "cancelled" : "active", cancelledAt: isDate(r.cancelledAt) ? r.cancelledAt : "",
      keepUntil: isDate(r.keepUntil) ? r.keepUntil : "", prevId: typeof r.prevId === "string" ? r.prevId : "", renewAck: isDate(r.renewAck) ? r.renewAck : "",
      via: typeof r.via === "string" ? r.via.slice(0, 40) : "", service: typeof r.service === "string" ? r.service.slice(0, 40) : "",
      unit: VERB[r.unit] ? r.unit : catOf(cat).unit, uses: Array.isArray(r.uses) ? [...new Set(r.uses.filter(isDate))].sort() : [],
      createdAt: Number(r.createdAt) || 0, color: ((Number(r.color) | 0) % 8 + 8) % 8,
      label: String(r.label || autoLabel(name)).slice(0, 3),
      emoji: typeof r.emoji === "string" && r.emoji.trim() ? r.emoji.trim().slice(0, 8) : catOf(cat).emoji,
      sample: r.sample === true || /\(예시\)/.test(name), suggestCut: r.suggestCut === true,
      repAck: /^\d{4}-\d{2}$/.test(r.repAck) ? r.repAck : ""
    };
  };
  const save = it => store.put(it).catch(() => toast("저장하지 못했어요. 연결을 확인하고 다시 해 주세요."));

  // ---------- 고르기 ----------
  const sorted = () => [...items].sort((x, y) => x.createdAt - y.createdAt);
  const live = () => sorted().filter(it => it.status === "active");
  const counted = () => live().filter(it => it.mode === "count");
  const flats = () => live().filter(it => it.mode === "flat");
  const gone = () => sorted().filter(it => it.status === "cancelled");
  const find = id => items.find(x => x.id === id);
  const monthlyTotal = () => live().reduce((s, it) => { const a = analyze(it); return a.state === "active" ? s + a.monthly : s; }, 0);

  // ---------- 화면 조각 ----------
  const isText = e => /^[A-Za-z0-9+]{1,4}$/.test(e);
  const mark = it => isText(it.emoji) ? `<span class="tmark">${esc(it.emoji)}</span>` : `<span class="emo">${esc(it.emoji)}</span>`;
  const av = (it, cls = "") => `<span class="av t${it.color} ${cls}" aria-hidden="true">${esc(it.label)}</span>`;
  let popKey = "";
  function stampBtn(it, d) {
    const t = todayStr(), on = it.uses.includes(d), dis = d > t || !eligible(it, d);
    const pop = popKey === it.id + d ? " thunk" : "";
    return `<button type="button" class="stampbtn" data-stamp="${esc(it.id)}" data-day="${d}" aria-pressed="${on}" ${dis ? "disabled" : ""} aria-label="${esc(shortName(it))} ${on ? "도장 지우기" : "도장 찍기"}">
      <span class="sb-c t${it.color}${on ? " on" : ""}${pop}">${on ? mark(it) : esc(it.label)}</span>
      <span class="sb-l${on ? " on" : ""}">${on ? "찍었어요" : esc(stampName(it))}</span></button>`;
  }
  function taskHtml(it, title, sub, btns, note) {
    return `<div class="task" data-id="${esc(it.id)}"><div class="task-h">${av(it)}<div><b>${esc(title)}</b><span class="sub">${esc(sub)}</span></div></div>
      <div class="task-b">${btns.map(([act, l, s], i) => `<button type="button" class="tbtn${i === 1 ? " pri" : ""}" data-act="${act}"><b>${esc(l)}</b><span>${esc(s)}</span></button>`).join("")}</div>
      ${note ? `<p class="note">${esc(note)}</p>` : ""}</div>`;
  }
  function buildTasks(t = todayStr()) {
    const out = [];
    for (const it of live()) {
      const a = analyze(it, t), nm = shortName(it);
      if (promoDue(it, t)) {
        const d = daysBetween(t, it.promoEnd);
        out.push({ d, icon: "⏰", title: `${nm} 할인이 ${d === 0 ? "오늘" : d + "일 뒤"} 끝나요`, html: taskHtml(it, `${nm} 할인이 ${d === 0 ? "오늘" : d + "일 뒤"} 끝나요`, `${md(it.promoEnd)}부터 ${won(it.price)} → ${won(it.after)}`,
          [["promoOk", "계속 쓰기", `다음 달부터 ${won(it.after)}`], ["cancel", "해지했어요", `한 달 ${won(it.after / it.months)} 아껴요`]], `해지는 ${nm} 앱이나 홈페이지에서 한 다음 눌러 주세요`) });
      }
      if (it.kind === "pass" && a.state === "active" && a.remaining <= 14 && it.renewAck !== a.pEnd && !renewedFrom(it)) {
        out.push({ d: a.remaining, icon: "🔁", title: `${nm} 이용권이 ${a.remaining === 0 ? "오늘 끝나요" : a.remaining + "일 남았어요"}`, html: taskHtml(it, `${nm} 이용권이 ${a.remaining === 0 ? "오늘 끝나요" : a.remaining + "일 남았어요"}`,
          `이번 기간 ${a.uses}번 · 1번 ${won(a.perUse)}`, [["noRenew", "안 할게요", "이번엔 끝낼게요"], ["renew", "재등록", `${md(a.pEnd)}부터 이어서`]]) });
      }
      const why = cancelReason(it, a, t);
      if (why) out.push({ d: 99, icon: "✂️", title: why.title, html: taskHtml(it, why.title, `${planName(it)} ${won(a.price)} · 1년이면 ${won(monthlyOf(it) * 12)}`,
        [["keep", "계속 쓸게요", "다시 안 물어봐요"], ["cancel", "해지했어요", `1년 ${won(monthlyOf(it) * 12)} 아껴요`]], `해지는 ${nm} 앱이나 홈페이지에서 한 다음 눌러 주세요`) });
    }
    return out.sort((x, y) => x.d - y.d);
  }

  // ---------- 도장 탭 ----------
  const cnt = (n, it) => `${n}${it.unit === "편" ? "편" : "번"}`;
  const NEED = { "회": "가야", "편": "봐야", "주문": "시켜야", "일": "써야" };
  const need = it => NEED[it.unit] || NEED["일"];
  let openTask = -1;
  function emptyHtml() {
    return `<section class="card empty"><h2>매달 나가는 돈을 넣어 보세요</h2>
      <p>월세·통신비 같은 고정비와 헬스장·넷플릭스 같은 구독을 넣고, 쓴 날 도장을 찍으면 1번에 얼마인지 알려줘요.</p>
      <div class="rowb"><button class="btn pri" type="button" data-act="onbPick">한 번에 골라 넣기</button><button class="btn" type="button" data-act="sample">예시로 둘러보기</button></div></section>`;
  }
  function stampCard(it, t) {
    const a = analyze(it, t), v = verbs(it), on = it.uses.includes(t), now = popKey === it.id + t;

      mid = `<span class="sc-pair"><span class="sc-old">${won(before)}</span><span class="sc-new">${won(a.perUse)}</span></span><span class="sc-done">${now ? "방금 내려갔어요" : "오늘 찍었어요"} · ${st}</span>`;
      foot = bar ? `<span class="sc-f">${bar}</span>` : "";
      if (now) {
        const nth = `${periodWord(it)} ${a.uses}번째예요!`;

          : a.uses === be ? `본전 뽑았어요! 이제부터는 ${v[2]} 갈수록 이득이에요.<span>따로 냈을 때보다 ${won(gain)} 아꼈어요</span>`
          : `${nth} 따로 냈을 때보다 ${won(gain)} 아꼈어요.`;
      }
    } else if (be && a.left === 0) {
      mid = `<span class="sc-ok">본전 뽑았어요 · ${won(gain)} 아낌</span><span class="sc-nx">오늘 ${v[2]} 1번에<b>${won(a.nextPerUse)}</b></span>`;
    } else {
      mid = `<span class="sc-now">현재 1번에 ${won(a.perUse)}</span><span class="sc-nx">오늘 ${v[2]}<b>${won(a.nextPerUse)}</b></span>`;
      if (be) foot = `<span class="sc-f">${bar}<span>본전까지 ${cnt(a.left, it)} · 따로 내면 1번 ${won(it.ref)} 기준</span></span>`;
    }
    const btn = `<button type="button" class="sbig${on ? " on" : ""}${now ? " thunk" : ""}" data-stamp="${esc(it.id)}" data-day="${t}" aria-pressed="${on}" aria-label="${esc(stampName(it))} ${on ? "오늘 도장 지우기" : "오늘 도장 찍기"}">${on ? mark(it) : `오늘<br>${v[0]}`}</button>`;
    return `<div class="scard${now ? " hl" : ""}" data-card="${esc(it.id)}"><div class="sc-h"><button type="button" class="sc-ic" data-open="${esc(it.id)}" aria-label="${esc(shortName(it))} 자세히">${mark(it)}</button>
      <span class="sc-m"><span class="sc-n">${esc(stampName(it))}<small>${periodWord(it)} ${cnt(a.uses, it)}</small></span>${mid}</span>${btn}</div>${foot}</div>
      ${nudge ? `<p class="msg nudge" id="stampMsg">${nudge}</p>` : ""}`;
  }
  let viewMonth = todayStr().slice(0, 7), selDay = todayStr().endsWith("-01") ? todayStr() : addDays(todayStr(), -1);
  function dayMarks(list) {
    const shown = list.slice(0, 3).map(it => `<span>${mark(it)}</span>`).join("");
    return `<span class="mk">${shown}${list.length > 3 ? `<small>+${list.length - 3}</small>` : ""}</span>`;
  }
  function calHtml(src, t) {
    const [y, m] = viewMonth.split("-").map(Number), first = new Date(y, m - 1, 1), dim = new Date(y, m, 0).getDate();
    const byDay = {};
    for (const it of src) for (const d of it.uses) if (d.startsWith(viewMonth)) (byDay[d] ||= []).push(it);
    const total = Object.values(byDay).reduce((s, l) => s + l.length, 0);
    let h = `<div class="top calhead" id="stampCal"><div><h2 class="calttl">${m}월 도장 ${total}개</h2><p>깜빡한 날은 눌러서 찍어 주세요</p></div>
      <div class="navs"><button class="navbtn" type="button" data-act="prevM" aria-label="이전 달">‹</button><button class="navbtn" type="button" data-act="nextM" aria-label="다음 달">›</button></div></div>`;
    let g = DOW.map((d, i) => `<span class="dow${i === 0 ? " sun" : ""}">${d}</span>`).join("");
    for (let i = 0; i < first.getDay(); i++) g += `<span></span>`;
    for (let day = 1; day <= dim; day++) {
      const d = `${viewMonth}-${pad2(day)}`, list = byDay[d] || [], dow = (first.getDay() + day - 1) % 7;
      const cls = ["dbtn", dow === 0 ? "sun" : "", d === t ? "today" : "", d > t ? "future" : "", d === selDay ? "sel" : ""].join(" ");
      g += `<button type="button" class="${cls}" data-pick="${d}" aria-label="${m}월 ${day}일 도장 ${list.length}개" aria-pressed="${d === selDay}"><span class="n">${day}</span>${list.length ? dayMarks(list) : ""}</button>`;
    }
    h += `<section class="card" style="padding:14px 10px 10px"><div class="cal">${g}</div></section>`;
    const sd = parse(selDay), pads = src.filter(it => eligible(it, selDay) || it.uses.includes(selDay));
    const tag = selDay === t ? " · 오늘" : selDay === addDays(t, -1) ? " · 어제" : "";
    h += `<section class="card" id="dayPanel"><div class="ch"><h2 class="h2">${sd.getMonth() + 1}월 ${sd.getDate()}일 ${DOW[sd.getDay()]}요일${tag}</h2><span class="side">누르면 찍거나 지워요</span></div>
      ${selDay > t ? `<p class="sub">아직 오지 않은 날이에요.</p>` : pads.length ? `<div class="sgrid">${pads.map(it => stampBtn(it, selDay)).join("")}</div>` : `<p class="sub">이 날짜에 쓸 수 있는 항목이 없어요.</p>`}</section>`;
    return h;
  }
  function renderStamp() {
    const t = todayStr(), dt = parse(t), el = $("stampBody");
    let h = `<header class="top"><div><span class="date">${dt.getMonth() + 1}월 ${dt.getDate()}일 ${DOW[dt.getDay()]}요일</span><h1>오늘 쓴 거 있어요?</h1></div></header>`;
    if (loading) { el.innerHTML = h + `<div class="card"><p class="sub">불러오는 중…</p></div>`; return; }
    if (!items.length) { el.innerHTML = h + emptyHtml(); return; }
    if (items.some(it => it.sample)) h += `<div class="banner demo-on" id="sampleBar"><span>지금은 예시를 보고 있어요</span><button class="btn sm" type="button" data-act="clearSamples">예시 지우고 시작하기</button></div>`;
    const tasks = buildTasks(t);
    if (openTask >= tasks.length) openTask = -1;
    h += tasks.map((x, i) => i === openTask ? `<section class="card tcard">${x.html}</section>`
      : `<button type="button" class="tbanner" data-act="taskOpen" data-k="${i}"><span aria-hidden="true">${x.icon}</span><span class="tb-t">${esc(x.title)}</span><span aria-hidden="true">›</span></button>`).join("");
    const st = counted().filter(it => eligible(it, t));
    h += st.length ? `<div class="scards" id="stampCards">${st.map(it => stampCard(it, t)).join("")}</div>`
      : `<section class="card empty"><h2>도장 찍을 게 없어요</h2><p>헬스장·넷플릭스처럼 쓴 만큼 값을 하는 걸 넣으면, 쓴 날 도장을 찍고 1번에 얼마인지 볼 수 있어요.</p><div class="rowb"><button class="btn pri" type="button" data-act="openAdd">추가하기</button></div></section>`;
    if (counted().length) h += calHtml(counted(), t);
    el.innerHTML = h;
  }

  // ---------- 리포트 (달력의 한 달: 1일~말일) ----------
  const monthOf = d => d.slice(0, 7);
  const mFirst = k => `${k}-01`;
  const mShift = (k, n) => addMonths(mFirst(k), n).slice(0, 7);
  const mName = k => `${+k.slice(5)}월`;
  // 그 달에 쓴 횟수, 그 달 몫의 금액(중간에 시작·해지하면 날짜만큼), 본전 횟수로 판정해요
  function monthStat(it, k, t = todayStr()) {
    if (it.mode !== "count") return null;
    const s = mFirst(k), e = mFirst(mShift(k, 1)), dim = daysBetween(s, e);
    const from = it.start > s ? it.start : s;
    let to = e;
    if (it.kind === "pass") { const pe = addMonths(it.start, it.months); if (pe < to) to = pe; }
    if (it.status === "cancelled" && it.cancelledAt && it.cancelledAt < to) to = it.cancelledAt;
    const days = daysBetween(from, to);
    if (days < 7 || from > t) return null;
    const cost = monthlyOf(it, from) * days / dim, uses = usesIn(it, from, to);
    const be = it.ref > 0 ? Math.max(1, Math.ceil(cost / it.ref - 1e-9)) : null;
    const judge = u => be == null ? (u === 0 ? "bad" : "none") : u >= be ? "good" : u === 0 ? "bad" : (be - u <= 1 || u >= be * .75) ? "warn" : "bad";
    const cur = t < e, elapsed = cur ? Math.max(1, daysBetween(from, addDays(t, 1))) : days;
    const proj = cur ? Math.max(uses, Math.round(uses / elapsed * days)) : uses;
    return { k, uses, cost, be, perUse: uses ? cost / uses : cost, gain: be ? it.ref * uses - cost : 0, v: judge(uses), cur, proj, pv: judge(proj), left: cur ? Math.max(0, daysBetween(t, to) - 1) : 0 };
  }
  const yearCut = it => monthlyOf(it) * 12;
  const ORDER = { bad: 0, warn: 1, none: 2, good: 3 };
  const DOT = { bad: "var(--bad)", warn: "var(--warn)", good: "var(--good)", none: "var(--line)" };
  let repMonth = "", repPicked = false;
  function repRows(k, t) { return sorted().filter(it => it.mode === "count").map(it => ({ it, s: monthStat(it, k, t) })).filter(x => x.s); }
  // 지난달 리포트를 아직 안 봤고 못 뽑은 게 있으면 탭에 빨간 점
  const SEEN_KEY = "bonjeon-report-seen";
  function updateDot() {
    const t = todayStr(), last = mShift(monthOf(t), -1);
    let seen = ""; try { seen = localStorage.getItem(SEEN_KEY) || ""; } catch {}
    $("repDot").hidden = loading || seen === last || !repRows(last, t).some(x => x.s.v === "bad" && x.it.status === "active" && x.it.repAck !== last);
  }
  function ritem(it, line1, pill, tone, body = "", btns = "") {
    return `<div class="ritem" data-id="${esc(it.id)}"><button type="button" class="ritem-h" data-open="${esc(it.id)}"><span class="sc-ic sm">${mark(it)}</span>
      <span class="sc-m"><span class="nm">${esc(stampName(it))}</span><span class="ds">${esc(line1)}</span></span><span class="pill ${tone}">${esc(pill)}</span></button>${body}${btns}</div>`;
  }
  function renderReport() {
    const el = $("reportBody");
    if (loading) return;
    const t = todayStr(), cur = monthOf(t), last = mShift(cur, -1), lastRows = repRows(last, t);
    if (!repPicked || (repMonth !== cur && repMonth !== last)) repMonth = lastRows.length ? last : cur;
    const k = repMonth, isCur = k === cur, m = mName(k);
    let h = `<header class="top"><h1>${m} 리포트</h1><div class="seg" role="group" aria-label="달 고르기">
      <button type="button" data-rmonth="${last}" aria-pressed="${!isCur}">지난달</button><button type="button" data-rmonth="${cur}" aria-pressed="${isCur}">이번 달</button></div></header>`;
    if (!items.length) { el.innerHTML = h + emptyHtml(); return; }
    const rows = isCur ? repRows(cur, t) : lastRows;
    if (!rows.length) {
      h += `<section class="card empty"><h2>${isCur ? "도장 찍는 걸 넣어 보세요" : `${m}에는 기록이 없어요`}</h2><p>${isCur ? "헬스장·넷플릭스처럼 쓴 만큼 값을 하는 걸 넣으면, 달마다 본전 뽑았는지 알려줘요." : `달이 끝나면 그달에 본전 뽑았는지 여기서 알려 드려요. 이번 달은 ‘이번 달’에서 볼 수 있어요.`}</p></section>`;
    } else if (isCur) h += progressHtml(rows, t);
    else h += pastHtml(rows, k);
    const sv = savingsDetail(t);
    h += `<button type="button" class="card savedrow" data-act="savedSheet"><span>올해 아낀 돈</span><b class="good" id="savedTotal">${won(sv.total)} ›</b></button>`;
    el.innerHTML = h;
  }
  function segBar(list) { return `<span class="segbar">${list.map(v => `<span style="background:${DOT[v]}"></span>`).join("")}</span>`; }
  function pastHtml(rows, k) {
    const m = mName(k), pk = mShift(k, -1);
    const judged = rows.filter(x => x.s.v !== "none"), good = rows.filter(x => x.s.v === "good");
    const bad = rows.filter(x => x.s.v === "bad"), open = bad.filter(x => x.it.status === "active" && x.it.kind === "recurring" && x.it.repAck !== k);
    const cut = open.reduce((s, x) => s + yearCut(x.it), 0);
    let h = `<section class="card" id="repSum"><span class="lbl">${m}에 본전 뽑은 건</span><span class="hero">${judged.length}개 중 ${good.length}개</span>
      ${segBar(judged.map(x => x.s.v).sort((a, b) => ORDER[b] - ORDER[a]))}
      <span class="lbl">${open.length ? `못 뽑은 ${open.length}개를 해지하면 <b class="good">1년 ${won(cut)}</b> 아껴요` : bad.length ? "못 뽑은 건 다 정리했어요" : "다 본전 뽑았어요. 이대로 쓰면 돼요"}</span></section>`;
    const line = x => x.s.uses ? `${m}에 ${cnt(x.s.uses, x.it)} · 1번에 ${won(x.s.perUse)}` : `${m}에 한 번도 ${verbs(x.it)[1]}`;
    if (bad.length) {
      h += `<section class="card rsec" id="repBad"><span class="rsec-t bad">본전 못 뽑았어요 ${bad.length}</span>` + bad.map(x => {

      if (good.length) h += `<span class="rsec-t good">본전 뽑았어요 ${good.length}</span>` + good.map(x => ritem(x.it, `${m}에 ${cnt(x.s.uses, x.it)} · ${x.s.gain > 0 ? `따로 냈을 때보다 ${won(x.s.gain)} 아낌` : "딱 본전"}`, "본전", "good")).join("");

  function progressHtml(rows, t) {

    return `<div class="page-in onb onbq">${hd}<div><h1 class="h1">홈 화면에 추가하면<br>내일 바로 열려요</h1><p class="sub" style="margin-top:6px">쓴 날 도장 찍으러 올 때 편해요</p></div>
      <div class="ohome" aria-hidden="true">${"<span></span>".repeat(7)}<span class="me">본전</span></div>
      <div class="seg" role="radiogroup" aria-label="휴대폰 종류" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <label><input type="radio" name="onbos" value="ios" ${ios ? "checked" : ""}>아이폰</label><label><input type="radio" name="onbos" value="android" ${ios ? "" : "checked"}>안드로이드</label></div>
      <div class="osteps">${steps.map(([t, ic], i) => `<div><span class="n">${i + 1}</span><span class="t">${t}</span>${ic ? `<span class="ic">${ic}</span>` : ""}</div>`).join("")}</div>
</div>
      ${cta(`<button type="button" data-onb="finish">추가했어요</button>`, `<button type="button" class="textbtn" data-onb="finish">나중에 할게요</button>`)}`;
  }
  async function finishOnb(thenAdd) {
    // 미리 보기는 끝까지 둘러봐도 아무것도 저장하지 않아요
    if (onb.preview) { closeOnb(); return toast("미리 보기라 아무것도 저장하지 않았어요"); }
    const t = todayStr(), start = t.slice(0, 8) + "01", ps = onbPicked(), keep = onbKept();
    const made = keep.map((p, i) => { const c = catOf(p.cat), pl = planOf(p);
      // 운동은 고른 결제 방식으로 이름을 맞춰요 (헬스장 → 헬스장 6개월권)
      const name = p.cat === "fit" ? (pl.kind === "pass" ? `${onbShort(p)} ${passSfx(pl.months)}` : onbShort(p)) : p.name;
      return normalize({ id: newId() + i, createdAt: Date.now() + i, name, cat: p.cat, ...pl, price: onbPrice(p), start, mode: modeOf(p),
        ref: p.ref || 0, unit: c.unit, label: p.label || autoLabel(p.name), emoji: p.emoji || c.emoji, color: inkOf(p), status: "active", uses: [] }); });
    items.push(...made); closeOnb(); showTab("stamp", true); renderAll();
    const skipped = ps.length - keep.length;
    if (made.length) toast(`${made.length}개를 넣었어요${skipped ? ` · 금액을 안 넣은 ${skipped}개는 뺐어요` : ""}`);
    if (thenAdd) openAdd();
    for (const it of made) await save(it);
  }
  const onbGo = d => { const flow = onbFlow(); onb.key = flow[Math.max(0, Math.min(flow.indexOf(onb.key) + d, flow.length - 1))]; renderOnb(); $("onbPage").scrollTop = 0; };
  $("onbPage").addEventListener("click", async e => {
    const b = e.target.closest("[data-onb],[data-svc],[data-tier],[data-period],[data-cat],[data-ofold],[data-ojump],[data-odemo]");
    if (!b || b.disabled) return;
    if (b.dataset.cat) { const g = b.dataset.cat; onb.groups = onb.groups.includes(g) ? onb.groups.filter(x => x !== g) : [...onb.groups, g]; return renderOnb(); }
    if (b.dataset.svc) {
      const s = allServices().find(x => x.id === b.dataset.svc);
      if (svcOn(s)) onb.picked = onb.picked.filter(n => !s.names.includes(n)); else onb.picked.push(s.def);
      return refreshList();
    }
    if (b.dataset.tier) {
      // 요금제를 바꾸면 그 자리에서 바꿔요 (고른 순서 유지)
      const n = b.dataset.tier, at = onb.picked.findIndex(y => tierOf(n).includes(y));
      if (at >= 0) onb.picked.splice(at, 1, n); else onb.picked.push(n);
      return refreshList();
    }
    if (b.dataset.period) { const [n, v] = b.dataset.period.split("|"); onb.plan[n] = +v; return refreshList(); }
    if (b.dataset.ofold) { onb.open.push(b.dataset.ofold); return refreshList(); }
    if (b.dataset.odemo != null) {
      const i = +b.dataset.odemo, x = DEMOS[i];
      onb.demo[i] = x.uses + onb.demo[i] >= x.be ? 0 : onb.demo[i] + 1;
      // 카드만 바꿔요 (화면 전체를 다시 그리지 않게)
      const card = document.querySelector(`[data-odcard="${i}"]`); card.outerHTML = demoCard(i);
      const nb = document.querySelector(`[data-odcard="${i}"] .sbig`); if (onb.demo[i]) nb.classList.add("thunk");
      const won1 = DEMOS.some((y, k) => onb.demo[k] >= y.be - y.uses);
      $("onbNote").innerHTML = `${won1 ? "<b>이제 내 구독으로 해 볼까요?</b>" : "깜빡한 날은 나중에 찍어도 돼요 · 못 뽑으면 해지할지 알려 드려요"}<br>가입 없이, 기록은 내 휴대폰에만 남아요`;
      return;
    }
    if (b.dataset.ojump) { if (onb.q) { onb.q = ""; $("onbQ").value = ""; refreshList(); } $("og-" + b.dataset.ojump)?.scrollIntoView({ block: "start" }); return; }
    const a = b.dataset.onb;
    // 마지막 화면(claude.ai나 홈 화면 앱에서는 사용법 화면)이면 다음 대신 마쳐요
    if (a === "next") {
      if (onb.key === "cats") onb.find = false;
      const flow = onbFlow(); return flow.indexOf(onb.key) >= flow.length - 1 ? finishOnb(false) : onbGo(1);
    }
    if (a === "back") return onbGo(-1);
    if (a === "find") { onb.find = true; onb.key = "find"; renderOnb(); return $("onbPage").scrollTop = 0; }
    if (a === "skipAmt") { for (const p of onbPicked().filter(needsAmount)) delete onb.amt[p.key]; return onbGo(1); }
    if (a === "sample") { if (onb.preview) { closeOnb(); return toast("미리 보기에서는 예시를 넣지 않아요"); } closeOnb(); return loadSamples(); }
    if (a === "manual") { closeOnb(); return onb.preview ? toast("미리 보기라 아무것도 저장하지 않았어요") : openAdd(); }
    if (a === "finish") return finishOnb(false);
    if (a === "finishAdd") return finishOnb(true);
    if (a === "install") { await promptInstall(); return finishOnb(false); }
  });
  $("onbPage").addEventListener("change", e => { if (e.target.name === "onbos") { onb.os = e.target.value; renderOnb(); } });
  $("onbPage").addEventListener("input", e => {
    if (e.target.id === "onbQ") { onb.q = e.target.value; return refreshList(); }
    const k = e.target.dataset.amt; if (!k) return;
    const raw = String(e.target.value).replace(/[^\d]/g, "");
    e.target.value = raw === "" ? "" : Number(raw).toLocaleString("ko-KR");
    if (raw === "" || raw === "0") delete onb.amt[k]; else onb.amt[k] = Number(raw);
  });
  // 금액 칸에서 엔터: 다음 칸으로, 마지막 칸이면 다음 화면으로
  $("onbPage").addEventListener("keydown", e => {
    if (e.key !== "Enter" || !e.target.dataset.amt) return;
    e.preventDefault();
    const all = [...document.querySelectorAll("#onbPage [data-amt]")], i = all.indexOf(e.target);
    if (i < all.length - 1) all[i + 1].focus(); else onbGo(1);
  });

  // ---------- 탭 ----------
  const TABS = ["stamp", "report", "mine"], TAB_KEY = "bonjeon-tab";
  // 예전 주소(#home·#list·#cal·#save)도 새 탭으로 보내요
  const OLD_TAB = { home: "stamp", cal: "stamp", list: "mine", save: "report" };
  let tab = "stamp";
  function showTab(name, top) {
    name = OLD_TAB[name] || name;
    tab = TABS.includes(name) ? name : "stamp";
    document.querySelectorAll(".wrap > .panel").forEach(p => p.hidden = p.dataset.tab !== tab);
    document.querySelectorAll(".tab[data-go]").forEach(b => b.dataset.go === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
    try { localStorage.setItem(TAB_KEY, tab); } catch {}
    if (tab === "report" && !loading) { try { localStorage.setItem(SEEN_KEY, mShift(monthOf(todayStr()), -1)); } catch {} updateDot(); }
    if (top) window.scrollTo({ top: 0 });
  }
  function renderAll() { renderStamp(); renderReport(); renderMine(); updateDot(); if (detailId && !$("detailPage").hidden) renderDetail(); }
  let locks = 0;
  const lock = () => { document.documentElement.classList.add("lock"); };
  const unlock = () => { if ($("detailPage").hidden && $("addPage").hidden && $("savedSheet").hidden && $("setSheet").hidden && $("onbPage").hidden) document.documentElement.classList.remove("lock"); };

  // ---------- 알림 메시지 ----------
  let toastTimer, undoFn = null;
  function toast(msg, undo) {
    $("toastMsg").textContent = msg; undoFn = undo || null;
    $("toastUndo").hidden = !undo; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, 4500);
  }
  $("toastUndo").addEventListener("click", () => { const f = undoFn; $("toast").hidden = true; undoFn = null; f && f(); });

  // ---------- 이벤트 ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-stamp],[data-act],[data-go],[data-open],[data-rmonth],[data-pick],[data-preset],[data-group]");
    if (!el || el.disabled) return;
    const ds = el.dataset;
    if (ds.stamp) { const it = find(ds.stamp); if (it) toggleStamp(it, ds.day); return; }
    if (ds.go) { if (!$("detailPage").hidden) closeDetail(); return showTab(ds.go, true); }
    if (ds.open) return openDetail(ds.open);
    if (ds.rmonth) { repMonth = ds.rmonth; repPicked = true; return renderReport(); }
    if (ds.pick) { selDay = ds.pick; return renderStamp(); }
    if (ds.preset) { add.preset = allPresets().find(p => p.key === ds.preset); add.cat = add.preset.cat; add.step = 2; add.autoName = true; renderAdd(); $("addPage").scrollTop = 0; return; }
    if (ds.group) { add.group = Number(ds.group); renderAdd(); $("addPage").scrollTop = 0; return; }
    const act = ds.act;
    if (act === "openAdd") return openAdd();
    if (act === "closeAdd") return closeAdd();
    if (act === "formBack") { add.step = 1; add.preset = null; return renderAdd(); }
    if (act === "groupBack") { add.group = null; return renderAdd(); }
    if (act === "manual") { add.preset = null; add.cat = "etc"; add.step = 2; renderAdd(); setTimeout(() => { if (!$("addBody").contains(document.activeElement) || document.activeElement.tagName === "BUTTON") $("fName")?.focus(); }, 30); return; }
    if (act === "sample") return loadSamples();
    if (act === "onbPick") return openOnb("cats");
    if (act === "onbPreview") { $("setSheet").hidden = true; return openOnb("intro", true); }
    if (act === "clearSamples") return clearSamples();
    if (act === "savedSheet") return openSaved();
    if (act === "closeSheet") { $("savedSheet").hidden = true; return unlock(); }
    if (act === "closeDetail") return closeDetail();
    if (act === "taskOpen") { openTask = Number(ds.k); return renderStamp(); }
    if (act === "openSet") { $("setSheet").hidden = false; return lock(); }
    if (act === "closeSet") { $("setSheet").hidden = true; return unlock(); }
    if (act === "prevM" || act === "nextM") { const d = new Date(+viewMonth.slice(0, 4), +viewMonth.slice(5) - 1 + (act === "nextM" ? 1 : -1), 1); viewMonth = ymd(d).slice(0, 7); return renderStamp(); }
    if (act === "dPrev" || act === "dNext") { const d = new Date(+detailMonth.slice(0, 4), +detailMonth.slice(5) - 1 + (act === "dNext" ? 1 : -1), 1); detailMonth = ymd(d).slice(0, 7); return renderDetail(); }
    const holder = el.closest("[data-id]"), it = holder && find(holder.dataset.id);
    if (it) itemAction(act, it);
  });
  for (const id of ["savedSheet", "setSheet"]) $(id).addEventListener("click", e => { if (e.target === $(id)) { $(id).hidden = true; unlock(); } });
  $("addSave").addEventListener("click", submitForm);
  $("addBody").addEventListener("submit", e => { e.preventDefault(); submitForm(); });
  $("addBody").addEventListener("input", e => {
    if (e.target.id === "q") { add.q = e.target.value; return renderResults(); }
    if (e.target.id === "fName") add.autoName = false;
    if (["fPrice", "fAfter", "fRef"].includes(e.target.id)) { const raw = String(e.target.value).replace(/[^\d]/g, ""); e.target.value = raw === "" ? "" : Number(raw).toLocaleString("ko-KR"); }
    if (e.target.id === "fEmoji" && e.target.value) document.querySelectorAll('input[name="emo"]').forEach(r => r.checked = false);
    formUi();
  });
  $("addBody").addEventListener("change", e => {
    if (e.target.id === "fBundle" && e.target.checked) {
      const m = MEMBERSHIPS.find(x => x.name === fv("fVia"));
      if (m?.price && (!numIn(fv("fPrice")) || numIn(fv("fPrice")) === add.preset?.price)) $("fPrice").value = fmt(m.price);
      $("fName").value = fv("fName").replace(/\s+(광고형|베이직|스탠다드|프리미엄)$/, "");
    }
    if (e.target.id === "fVia") { const m = MEMBERSHIPS.find(x => x.name === e.target.value); if (m?.price) $("fPrice").value = fmt(m.price); }
    if (e.target.name === "emo") $("fEmoji").value = "";
    if (e.target.name === "plan" || e.target.name === "passm") {
      const nm = fv("fName").trim(), m = nm.match(PLAN_SFX), base = m ? nm.slice(0, m.index) : nm;
      const months = Number(document.querySelector('input[name="passm"]:checked')?.value || 12);
      if (base && (m || add.autoName)) $("fName").value = planVal() === "pass" ? `${base} ${passSfx(months)}` : base;
    }
    formUi();
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("savedSheet").hidden) { $("savedSheet").hidden = true; return unlock(); }
    if (!$("setSheet").hidden) { $("setSheet").hidden = true; return unlock(); }
    if (!$("addPage").hidden) return closeAdd();
    if (!$("detailPage").hidden) return closeDetail();
  });
  addEventListener("hashchange", () => { if (location.hash !== "#start") showTab(location.hash.slice(1), true); });

  // ---------- 백업 ----------
  $("expBtn").addEventListener("click", async () => {
    const blob = new Blob([JSON.stringify({ app: "bonjeon", version: 2, exportedAt: new Date().toISOString(), items }, null, 2)], { type: "application/json" });
    const filename = `bonjeon-backup-${todayStr()}.json`;
    try { const file = new File([blob], filename, { type: "application/json" }); if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: "본전 백업" }); return toast("백업 파일을 보냈어요"); } }
    catch (err) { if (err?.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast(`${filename}로 저장했어요`);
  });
  $("installBtn").addEventListener("click", async () => { if (!(await promptInstall())) toast("나중에 여기서 다시 설치할 수 있어요"); });
  $("impFile").addEventListener("change", async e => {
    const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
    try {
      const data = JSON.parse(await f.text()), list = Array.isArray(data) ? data : data?.items;
      if (!Array.isArray(list)) throw new Error("format");
      const incoming = list.filter(r => r && typeof r.id === "string").map(normalize);
      for (const it of incoming) { const i = items.findIndex(x => x.id === it.id); i >= 0 ? items[i] = it : items.push(it); await store.put(it); }
      renderAll(); toast(`${incoming.length}개를 불러왔어요`);
    } catch { toast("백업 파일을 읽지 못했어요. 본전에서 저장한 .json 파일인지 확인해 주세요."); }
  });

  // ---------- 처음부터 ----------
  $("resetBtn").addEventListener("click", () => { $("resetAsk").hidden = false; $("resetBox").hidden = true; });
  $("resetNo").addEventListener("click", () => { $("resetAsk").hidden = true; $("resetBox").hidden = false; });
  $("resetYes").addEventListener("click", async () => {
    const all = items.slice(); items = []; $("resetAsk").hidden = true; $("resetBox").hidden = false;
    $("setSheet").hidden = true; renderAll(); showTab("stamp", true); openOnb();
    for (const it of all) { try { await store.del(it.id); } catch {} }
  });

  // ---------- 시작 ----------
  async function boot() {
    try { store = await dbStore(); } catch { store = null; }
    cloud = !!store;
    $("storeNote").innerHTML = store ? "<b>내 계정에 저장돼요.</b> 다른 기기에서 열어도 그대로 있고, 나만 볼 수 있어요." : "<b>이 기기에만 저장돼요.</b> 서버로 보내지 않아요.";
    if (!store && !window.claude) {
      $("backup").hidden = false;
      const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
      $("installTip").hidden = standalone || !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      installUi();
    }
    store = store || localStore;
    try { items = (await store.all()).map(normalize); } catch { items = []; toast("기록을 불러오지 못했어요. 새로고침해 주세요."); }
    loading = false;
    renderAll();
    if (tab === "report") showTab("report");
    if (!items.length && !onbSeen()) openOnb();
    else if (location.hash === "#start") openOnb("intro", items.length > 0);
  }
  showTab((/^#(stamp|report|mine|home|list|cal|save)$/.test(location.hash) && location.hash.slice(1)) || (() => { try { return localStorage.getItem(TAB_KEY); } catch { return null; } })() || "stamp");
  renderAll();
  boot();
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
